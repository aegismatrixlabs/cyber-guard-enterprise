<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard Enterprise - Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f111a; color: #e2e8f0; }
        .login-card { background-color: #171b2b; border: 1px solid #2a2f44; }
        .custom-input { background-color: #0f111a; border: 1px solid #2a2f44; transition: all 0.3s; }
        .custom-input:focus { border-color: #00c853; outline: none; box-shadow: 0 0 0 3px rgba(0, 200, 83, 0.2); }
    </style>
</head>
<body class="flex items-center justify-center h-screen">
    <div class="login-card w-full max-w-md p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#00ff88] flex items-center justify-center gap-2"><i class="fas fa-shield-halved"></i> AEGISMATRIX</h1>
            <p class="text-[#8b92b6] text-sm mt-2">CyberGuard Enterprise'e Giriş Yap</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-[#8b92b6] mb-1">Kullanıcı Adı</label>
                <input type="text" id="username" value="admin" class="custom-input w-full px-4 py-3 rounded-lg text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-[#8b92b6] mb-1">Şifre</label>
                <input type="password" id="password" value="admin123" class="custom-input w-full px-4 py-3 rounded-lg text-white">
            </div>
            <button type="button" onclick="handleLogin()" class="w-full py-3 bg-[#00c853] hover:bg-[#00e676] text-black font-bold rounded-lg transition shadow-lg flex items-center justify-center gap-2"><i class="fas fa-lock-open"></i> Sisteme Giriş Yap</button>
            <div id="msg" class="text-center text-sm text-[#ff5252] mt-2"></div>
        </form>
        <div class="mt-6 text-center text-xs text-[#8b92b6] border-t border-[#2a2f44] pt-4">© 2026 CyberGuard Enterprise</div>
    </div>

    <script>
        async function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                const res = await fetch('/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${u}&password=${p}`
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('msg').innerText = 'Kullanıcı adı veya şifre hatalı!';
                }
            } catch (e) { 
                document.getElementById('msg').innerText = 'Sunucuya bağlanılamıyor! (Uvicorn çalışıyor mu?)'; 
            }
        }
    </script>
</body>
</html>
