<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>Şifremi Unuttum - AEGISMATRIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background-color:#0f111a;color:#e2e8f0;}.login-card{background-color:#171b2b;border:1px solid #2a2f44;}</style>
</head>
<body class="flex items-center justify-center h-screen">
<div class="login-card w-full max-w-md p-8 rounded-2xl shadow-2xl">
    <div class="text-center mb-8"><h1 class="text-3xl font-bold text-[#00ff88]">AEGISMATRIX</h1><p class="text-[#8b92b6] text-sm mt-2">Şifre Sıfırlama</p></div>
    <form id="forgotForm" class="space-y-6">
        <p class="text-[#8b92b6] text-sm text-center">Hesabınıza kayıtlı olan e-posta adresini girin. Size bir şifre sıfırlama bağlantısı göndereceğiz.</p>
        <input type="email" id="email" placeholder="E-posta Adresi" class="w-full px-4 py-3 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] focus:border-[#00c853] outline-none">
        <button type="button" onclick="handleForgotPassword()" class="w-full py-3 bg-[#58a6ff] hover:bg-[#1f6feb] text-white font-bold rounded-lg">Bağlantı Gönder</button>
        <div id="msg" class="text-center text-sm mt-2"></div>
        <div class="text-center text-sm text-[#8b92b6] mt-4 border-t border-[#2a2f44] pt-4">
            <a href="/" class="text-[#58a6ff] hover:underline font-bold">Giriş Sayfasına Dön</a>
        </div>
    </form>
</div>
<script>
async function handleForgotPassword() {
    const email = document.getElementById('email').value;
    if(!email) return document.getElementById('msg').innerText = 'Lütfen e-posta adresinizi girin.';
    const res = await fetch('/auth/forgot-password', { method: 'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email: email}) });
    const data = await res.json();
    const msgEl = document.getElementById('msg');
    if(res.ok){ msgEl.innerText = '✅ ' + data.message; msgEl.style.color = '#00ff88'; }
    else { msgEl.innerText = '❌ ' + (data.detail || 'Bir hata oluştu.'); msgEl.style.color = '#ff5252'; }
}
</script>
</body>
</html>
