<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>Giriş Yap - AEGISMATRIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background-color:#0f111a;color:#e2e8f0;}.login-card{background-color:#171b2b;border:1px solid #2a2f44;}</style>
</head>
<body class="flex items-center justify-center h-screen">
<div class="login-card w-full max-w-md p-8 rounded-2xl shadow-2xl">
    <div class="text-center mb-8"><h1 class="text-3xl font-bold text-[#00ff88]">AEGISMATRIX</h1><p class="text-[#8b92b6] text-sm mt-2">CyberGuard Enterprise</p></div>
    <form id="loginForm" class="space-y-6">
        <input type="text" id="username" value="admin" placeholder="Kullanıcı Adı" class="w-full px-4 py-3 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] focus:border-[#00c853] outline-none">
        <input type="password" id="password" value="admin123" placeholder="Şifre" class="w-full px-4 py-3 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] focus:border-[#00c853] outline-none">
        <button type="button" onclick="handleLogin()" class="w-full py-3 bg-[#00c853] hover:bg-[#00e676] text-black font-bold rounded-lg">Sisteme Giriş Yap</button>
        <div id="msg" class="text-center text-sm text-[#ff5252] mt-2"></div>
        <div class="text-center text-sm text-[#8b92b6] mt-4 border-t border-[#2a2f44] pt-4 space-y-2 flex flex-col">
            <a href="/forgot-password" class="text-[#58a6ff] hover:underline font-medium">Şifremi Unuttum?</a>
            <div>Hesabınız yok mu? <a href="/register" class="text-[#58a6ff] hover:underline font-bold">Kayıt Ol</a></div>
        </div>
    </form>
</div>
<script>
async function handleLogin() {
    const u = document.getElementById('username').value, p = document.getElementById('password').value;
    const res = await fetch('/auth/token', { method: 'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:`username=${u}&password=${p}` });
    const data = await res.json();
    if(res.ok){ localStorage.setItem('token', data.access_token); window.location.href='/dashboard'; }
    else document.getElementById('msg').innerText = 'Kullanıcı adı veya şifre hatalı!';
}
</script>
</body>
</html>
