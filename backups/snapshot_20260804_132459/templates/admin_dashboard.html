<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>CyberGuard | Admin Panel</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Inter',sans-serif;background-color:#0f111a;color:#e2e8f0;}.bg-card{background-color:#171b2b;border:1px solid #2a2f44;}</style></head>
<body><div class="min-h-screen bg-[#0f111a] p-6"><div class="max-w-7xl mx-auto"><header class="flex justify-between items-center border-b border-[#2a2f44] pb-4 mb-8"><h1 class="text-2xl font-bold text-[#00ff88]"><i class="fas fa-user-shield mr-2"></i>Admin Paneli</h1><button onclick="window.location.href='/dashboard'" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition">Ana Panele Dön</button></header>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"><div class="bg-card rounded-xl p-6"><div class="text-[#8b92b6] text-xs">Toplam Kullanıcı</div><div id="totalUsers" class="text-3xl font-bold mt-1">0</div></div><div class="bg-card rounded-xl p-6"><div class="text-[#8b92b6] text-xs">Aktif Lisanslar</div><div id="activeLicenses" class="text-3xl font-bold text-green-400 mt-1">0</div></div><div class="bg-card rounded-xl p-6"><div class="text-[#8b92b6] text-xs">Toplam Varlık</div><div id="totalAssetsAdmin" class="text-3xl font-bold text-[#58a6ff] mt-1">0</div></div></div>
<div class="bg-card rounded-xl border border-[#2a2f44] shadow-lg overflow-hidden"><div class="p-6 border-b border-[#2a2f44]"><h2 class="text-lg font-semibold">Kullanıcı Yönetimi</h2></div>
<table class="w-full text-left border-collapse"><thead><tr class="bg-[#0f111a]/50 text-[#8b92b6] text-xs uppercase"><th class="p-4">ID</th><th class="p-4">Kullanıcı</th><th class="p-4">Süper Admin</th><th class="p-4">Lisans Durumu</th><th class="p-4">Son Giriş</th><th class="p-4 text-right">İşlem</th></tr></thead><tbody id="adminUserTbody" class="divide-y divide-[#2a2f44]"></tbody></table></div></div></div>
<script>
const token = localStorage.getItem('token'); if (!token) window.location.href = '/';
async function fetchWithAuth(url, options={}) { options.headers = { ...options.headers, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }; return fetch(url, options); }
async function loadAdminStats() {
    const res = await fetchWithAuth('/api/admin/stats'); const data = await res.json();
    document.getElementById('totalUsers').innerText = data.total_users;
    document.getElementById('activeLicenses').innerText = data.active_licenses;
    document.getElementById('totalAssetsAdmin').innerText = data.total_assets;
}
async function loadAdminUsers() {
    const res = await fetchWithAuth('/api/admin/users'); const data = await res.json();
    const tbody = document.getElementById('adminUserTbody'); tbody.innerHTML = '';
    data.forEach(u => {
        const row = tbody.insertRow();
        row.innerHTML = `
            <td class="p-4 text-sm text-[#8b92b6]">#${u.id}</td>
            <td class="p-4 text-sm font-bold text-white">${u.username}</td>
            <td class="p-4 text-sm">${u.is_super_admin ? '<span class="text-green-400"><i class="fas fa-crown"></i> Evet</span>' : 'Hayır'}</td>
            <td class="p-4 text-sm font-bold ${u.license_status === 'ACTIVE' ? 'text-green-400' : 'text-red-400'}">${u.license_status}</td>
            <td class="p-4 text-sm text-[#8b92b6]">${u.last_login || 'Henüz giriş yapmadı'}</td>
            <td class="p-4 text-right">
                ${u.is_super_admin ? '' : `<button onclick="toggleLicense(${u.id}, '${u.license_status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}')" class="px-3 py-1 text-xs rounded bg-[#58a6ff] hover:bg-[#1f6feb] text-white transition">${u.license_status === 'ACTIVE' ? 'Pasif Yap' : 'Aktif Et'}</button>`}
            </td>
        `;
    });
}
async function toggleLicense(userId, newStatus) {
    if(confirm("Lisans durumunu değiştirmek istediğinize emin misiniz?")) {
        await fetchWithAuth(`/api/admin/users/${userId}/license`, { method: 'PUT', body: JSON.stringify({ status: newStatus }) });
        loadAdminUsers();
    }
}
window.onload = () => { loadAdminStats(); loadAdminUsers(); };
</script></body></html>
