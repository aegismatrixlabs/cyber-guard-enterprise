<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>Kayıt Ol - AEGISMATRIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background-color:#0f111a;color:#e2e8f0;}.login-card{background-color:#171b2b;border:1px solid #2a2f44;}</style>
</head>
<body class="flex items-center justify-center h-screen">
<div class="login-card w-full max-w-md p-8 rounded-2xl shadow-2xl">
    <div class="text-center mb-8"><h1 class="text-3xl font-bold text-[#00ff88]">AEGISMATRIX</h1><p class="text-[#8b92b6] text-sm mt-2">CyberGuard Enterprise - Kayıt Ol</p></div>
    <form id="registerForm" class="space-y-6">
        <input type="text" id="username" placeholder="Kullanıcı Adı" class="w-full px-4 py-3 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] focus:border-[#00c853] outline-none">
        <input type="email" id="email" placeholder="E-posta Adresi" class="w-full px-4 py-3 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] focus:border-[#00c853] outline-none">
        <input type="password" id="password" placeholder="Şifre" class="w-full px-4 py-3 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] focus:border-[#00c853] outline-none">
        <button type="button" onclick="handleRegister()" class="w-full py-3 bg-[#58a6ff] hover:bg-[#1f6feb] text-white font-bold rounded-lg">Hesap Oluştur</button>
        <div id="msg" class="text-center text-sm text-[#ff5252] mt-2"></div>
        <div class="text-center text-sm text-[#8b92b6] mt-4 border-t border-[#2a2f44] pt-4">
            Zaten hesabınız var mı? <a href="/" class="text-[#58a6ff] hover:underline font-bold">Giriş Yap</a>
        </div>
    </form>
</div>
<script>
async function handleRegister() {
    const u = document.getElementById('username').value, e = document.getElementById('email').value, p = document.getElementById('password').value;
    if(!u||!e||!p) return document.getElementById('msg').innerText='Tüm alanları doldurun.';
    const res = await fetch('/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, email:e, password:p}) });
    const data = await res.json();
    if(res.ok){ alert("✅ " + data.message); window.location.href='/'; }
    else document.getElementById('msg').innerText = data.detail || "Bir hata oluştu.";
}
</script>
</body>
</html>
