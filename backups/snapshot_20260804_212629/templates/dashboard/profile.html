<div id="profile" class="section-content bg-card rounded-xl border border-[#2a2f44] shadow-lg p-6 max-w-2xl mx-auto">
    <h2 class="text-xl font-bold text-white mb-6"><i class="fas fa-user-cog text-[#00ff88] mr-2"></i>Hesap Ayarları</h2>
    <div class="space-y-6">
        <div><label class="block text-[#8b92b6] text-sm font-medium mb-1">Kullanıcı Adı</label><input type="text" id="profileUsername" disabled class="w-full px-4 py-2 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] cursor-not-allowed opacity-70"></div>
        <div><label class="block text-[#8b92b6] text-sm font-medium mb-1">E-posta Adresi</label><input type="email" id="profileEmail" disabled class="w-full px-4 py-2 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] cursor-not-allowed opacity-70"></div>
        <div class="border-t border-[#2a2f44] pt-6">
            <h3 class="text-lg font-semibold text-white mb-4"><i class="fas fa-key text-[#58a6ff] mr-2"></i>Şifre Değiştir</h3>
            <div class="space-y-4">
                <div><label class="block text-[#8b92b6] text-sm font-medium mb-1">Eski Şifre</label><input type="password" id="oldPassword" class="w-full px-4 py-2 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] focus:border-[#00c853] outline-none"></div>
                <div><label class="block text-[#8b92b6] text-sm font-medium mb-1">Yeni Şifre</label><input type="password" id="newPassword" class="w-full px-4 py-2 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] focus:border-[#00c853] outline-none"></div>
                <button onclick="changePassword()" class="px-6 py-2 bg-[#00c853] hover:bg-[#00e676] text-black font-bold rounded-lg transition">Şifreyi Güncelle</button>
            </div>
        </div>
        <div id="profileMsg" class="text-center text-sm mt-2"></div>
    </div>
</div>

<!-- KENDİNE AİT BAĞIMSIZ JAVASCRIPT -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('token');
    if (!token) return;
    fetch('/auth/users/me', {
        headers: { 'Authorization': `Bearer ${token}` }
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('profileUsername').value = data.username;
        document.getElementById('profileEmail').value = data.email;
    })
    .catch(e => console.error(e));
});

async function changePassword() {
    const token = localStorage.getItem('token');
    if (!token) return;
    const old = document.getElementById('oldPassword').value;
    const newP = document.getElementById('newPassword').value;
    const msgEl = document.getElementById('profileMsg');
    
    if(!old || !newP) {
        if(msgEl) { msgEl.innerText = 'Lütfen tüm alanları doldurun.'; msgEl.style.color = '#ff5252'; }
        return;
    }

    const res = await fetch('/auth/users/me/password', {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ old_password: old, new_password: newP })
    });
    const data = await res.json();

    if(msgEl) {
        if(res.ok) {
            msgEl.innerText = '✅ ' + data.message;
            msgEl.style.color = '#00ff88';
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
        } else {
            let errorMsg = data.detail || 'Bir hata oluştu.';
            if (typeof errorMsg !== 'string') errorMsg = JSON.stringify(errorMsg);
            msgEl.innerText = '❌ ' + errorMsg;
            msgEl.style.color = '#ff5252';
        }
    }
}
</script>
