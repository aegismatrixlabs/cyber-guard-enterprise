<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>Yeni Şifre Belirle - AEGISMATRIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background-color:#0f111a;color:#e2e8f0;}.login-card{background-color:#171b2b;border:1px solid #2a2f44;}</style>
</head>
<body class="flex items-center justify-center h-screen">
<div class="login-card w-full max-w-md p-8 rounded-2xl shadow-2xl">
    <div class="text-center mb-8"><h1 class="text-3xl font-bold text-[#00ff88]">AEGISMATRIX</h1><p class="text-[#8b92b6] text-sm mt-2">Yeni Şifre Belirle</p></div>
    <form id="resetForm" class="space-y-6">
        <p class="text-[#8b92b6] text-sm text-center">Lütfen yeni şifrenizi girin.</p>
        <input type="password" id="newPassword" placeholder="Yeni Şifre" class="w-full px-4 py-3 rounded-lg text-white bg-[#0f111a] border border-[#2a2f44] focus:border-[#00c853] outline-none">
        <button type="button" onclick="handleResetPassword()" class="w-full py-3 bg-[#00c853] hover:bg-[#00e676] text-black font-bold rounded-lg">Şifreyi Sıfırla</button>
        <div id="msg" class="text-center text-sm mt-2"></div>
    </form>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

async function handleResetPassword() {
    const newPassword = document.getElementById('newPassword').value;
    const msgEl = document.getElementById('msg');
    
    if(!newPassword) {
        msgEl.innerText = 'Lütfen yeni bir şifre girin.';
        msgEl.style.color = '#ff5252';
        return;
    }
    if(!token) {
        msgEl.innerText = 'Geçersiz token. Lütfen maildeki bağlantıyı kullanın.';
        msgEl.style.color = '#ff5252';
        return;
    }
    
    try {
        const res = await fetch('/auth/reset-password', { 
            method: 'POST', 
            headers:{'Content-Type':'application/json'}, 
            body:JSON.stringify({token: token, new_password: newPassword}) 
        });
        const data = await res.json();
        
        if(res.ok){ 
            msgEl.innerText = '✅ ' + data.message; 
            msgEl.style.color = '#00ff88';
            // 3 saniye sonra giriş sayfasına yönlendir
            setTimeout(() => { window.location.href = '/'; }, 3000);
        } else { 
            // Hata mesajını düzgün string'e çevir
            let errorMsg = data.detail || 'Bir hata oluştu.';
            if (typeof errorMsg !== 'string') {
                errorMsg = JSON.stringify(errorMsg);
            }
            msgEl.innerText = '❌ ' + errorMsg; 
            msgEl.style.color = '#ff5252'; 
        }
    } catch (e) {
        msgEl.innerText = '❌ Sunucuya bağlanılamadı.';
        msgEl.style.color = '#ff5252';
    }
}
</script>
</body>
</html>
