version: '3.8'

services:
  db:
    image: postgres:15
    container_name: aegismatrix_db
    restart: always
    environment:
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: SuperSecurePassword123
      POSTGRES_DB: cyberguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegismatrix_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: aegismatrix_enterprise
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://cyberguard:SuperSecurePassword123@db:5432/cyberguard
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    volumes:
      - ./backups:/app/backups

volumes:
  postgres_data:
