<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard Enterprise | Güvenli Giriş & Kimlik Doğrulama</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0B132B',
                            card: '#1C2541',
                            accent: '#48CAE4',
                            glow: '#00F5D4',
                            danger: '#FF3366'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-cyber-dark text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center selection:bg-cyber-accent selection:text-cyber-dark">

    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-cyber-card via-cyber-dark to-cyber-dark -z-10"></div>

    <div class="max-w-md w-full mx-4">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-3 mb-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyber-accent to-cyber-glow flex items-center justify-center shadow-lg shadow-cyber-accent/20">
                    <i class="fa-solid fa-shield-halved text-cyber-dark text-2xl"></i>
                </div>
            </a>
            <h2 class="text-2xl font-bold tracking-tight text-white">CyberGuard SOC Girişi</h2>
            <p class="text-sm text-slate-400 mt-1">Kurumsal zafiyet yönetim paneline erişin</p>
        </div>

        <!-- Login Card -->
        <div class="bg-cyber-card border border-slate-800 rounded-2xl p-8 shadow-2xl relative">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyber-accent to-cyber-glow rounded-t-2xl"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
                <!-- Email / Username -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Kurumsal E-Posta</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email5" id="email" required autocomplete="email" placeholder="analyst@enterprise.com"
                            class="w-full pl-11 pr-4 py-3 bg-cyber-dark border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyber-accent focus:ring-1 focus:ring-cyber-accent transition">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Şifre</label>
                        <a href="#forgot" class="text-xs text-cyber-accent hover:underline">Şifremi Unuttum?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••••••"
                            class="w-full pl-11 pr-4 py-3 bg-cyber-dark border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyber-accent focus:ring-1 focus:ring-cyber-accent transition">
                    </div>
                </div>

                <!-- MFA / Security Token Input (Simulated State) -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">MFA Doğrulama Kodu (OTP)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="text" id="mfaCode" maxlength="6" placeholder="123 456"
                            class="w-full pl-11 pr-4 py-3 bg-cyber-dark border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 tracking-widest focus:outline-none focus:border-cyber-accent focus:ring-1 focus:ring-cyber-accent transition">
                    </div>
                </div>

                <!-- Submit Button with Idempotency Shield -->
                <button type="submit" id="submitBtn"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-cyber-accent to-cyber-glow text-cyber-dark font-bold rounded-xl shadow-lg shadow-cyber-accent/20 hover:opacity-90 transition flex items-center justify-center space-x-2">
                    <span>Güvenli Oturum Aç</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-cyber-card px-3 text-slate-500">Veya Kurumsal SSO</span></div>
            </div>

            <!-- SSO Login Options -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="handleSSO('SAML 2.0')" class="flex items-center justify-center py-2.5 px-4 bg-cyber-dark border border-slate-700 rounded-xl text-xs font-semibold text-slate-300 hover:border-cyber-accent transition">
                    <i class="fa-solid fa-id-badge mr-2 text-cyber-accent"></i> SAML SSO
                </button>
                <button onclick="handleSSO('OAuth/OIDC')" class="flex items-center justify-center py-2.5 px-4 bg-cyber-dark border border-slate-700 rounded-xl text-xs font-semibold text-slate-300 hover:border-cyber-accent transition">
                    <i class="fa-solid fa-shield-cat mr-2 text-cyber-glow"></i> OIDC / Azure
                </button>
            </div>
        </div>

        <!-- Security Footer Notice -->
        <div class="text-center mt-6 text-xs text-slate-500">
            <i class="fa-solid fa-lock text-cyber-accent mr-1"></i> 256-bit End-to-End TLS Şifreleme Koruma Altında
        </div>
    </div>

    <!-- Core Security Script (5 Chains Applied) -->
    <script>
        let isSubmitting = false; // Idempotency protection flag

        function handleLogin(event) {
            event.preventDefault();
            
            if (isSubmitting) return; // Prevent race conditions
            isSubmitting = true;

            const btn = document.getElementById('submitBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Doğrulanıyor...</span>`;
            btn.disabled = true;

            // Safe error handling & input simulation block
            try {
                setTimeout(() => {
                    // Simulated secure token generation and storage (Chain 3)
                    localStorage.setItem('cyber_guard_session', 'sec_token_9981247a8f');
                    alert('Kimlik doğrulama başarılı! SOC Paneline yönlendiriliyorsunuz.');
                    // window.location.href = 'dashboard.html';
                }, 1200);
            } catch (error) {
                console.error("Güvenlik istisnası yakalandı.");
            } finally {
                setTimeout(() => {
                    isSubmitting = false;
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                }, 1500);
            }
        }

        function handleSSO(provider) {
            alert(provider + ' protokolü ile kurumsal kimlik doğrulama başlatılıyor...');
        }
    </script>
</body>
</html>
