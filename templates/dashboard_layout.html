<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard | Enterprise Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f111a; color: #e2e8f0; }
        .sidebar { background-color: #1a1d2e; }
        .bg-card { background-color: #171b2b; border: 1px solid #2a2f44; }
        .custom-input { background-color: #0f111a; border: 1px solid #2a2f44; transition: all 0.3s; }
        .custom-input:focus { border-color: #00c853; outline: none; box-shadow: 0 0 0 3px rgba(0, 200, 83, 0.2); }
        .menu-link { transition: all 0.2s; cursor: pointer; }
        .menu-link:hover { background-color: rgba(255, 255, 255, 0.05); border-left: 3px solid #00c853; }
    </style>
</head>
<body>
    <div class="flex min-h-screen bg-[#0f111a]">
        <!-- Sidebar -->
        <div class="sidebar w-64 flex-shrink-0 flex flex-col justify-between h-screen border-r border-[#2a2f44] sticky top-0 hidden md:flex">
            <div>
                <div class="p-6 border-b border-[#2a2f44]">
                    <h1 class="text-2xl font-bold text-[#00ff88] flex items-center gap-2"><i class="fas fa-shield-halved"></i> AEGISMATRIX</h1>
                    <p class="text-xs text-[#8b92b6] mt-1">Enterprise Security</p>
                </div>
                <nav id="sidebarNav" class="mt-6 px-4 space-y-1">
                    <a href="/dashboard/home" class="menu-link flex items-center px-4 py-3 text-sm font-medium text-[#8b92b6] hover:text-white rounded-md"><i class="fas fa-chart-pie w-6"></i> Dashboard</a>
                    <a href="/dashboard/assets" class="menu-link flex items-center px-4 py-3 text-sm font-medium text-[#8b92b6] hover:text-white rounded-md"><i class="fas fa-server w-6"></i> Varlıklar</a>
                    <a href="/dashboard/legal_shield" class="menu-link flex items-center px-4 py-3 text-sm font-medium text-[#8b92b6] hover:text-white rounded-md"><i class="fas fa-shield w-6"></i> Legal Shield</a>
                    <a href="/dashboard/billing" class="menu-link flex items-center px-4 py-3 text-sm font-medium text-[#8b92b6] hover:text-white rounded-md"><i class="fas fa-credit-card w-6"></i> Lisans & Fatura</a>
                    <a href="/dashboard/profile" class="menu-link flex items-center px-4 py-3 text-sm font-medium text-[#8b92b6] hover:text-white rounded-md"><i class="fas fa-user-cog w-6"></i> Hesap Ayarları</a>
                    <a href="/dashboard/help" class="menu-link flex items-center px-4 py-3 text-sm font-medium text-[#8b92b6] hover:text-white rounded-md"><i class="fas fa-circle-question w-6"></i> Yardım / SSS</a>
                    <a href="/dashboard/about" class="menu-link flex items-center px-4 py-3 text-sm font-medium text-[#8b92b6] hover:text-white rounded-md"><i class="fas fa-circle-info w-6"></i> Hakkımızda</a>
                    <a id="adminPanelLink" href="/admin" class="menu-link hidden flex items-center px-4 py-3 text-sm font-medium text-[#58a6ff] hover:text-white rounded-md"><i class="fas fa-user-shield w-6"></i> Admin Paneli</a>
                </nav>
            </div>
            <div class="p-6 border-t border-[#2a2f44]">
                <button onclick="performLogout()" class="menu-link flex w-full items-center px-4 py-3 text-sm font-medium text-[#ff5252] hover:text-white rounded-md"><i class="fas fa-right-from-bracket w-6"></i> Oturumu Kapat</button>
            </div>
        </div>

        <!-- Ana İçerik Alanı -->
        <div class="flex-1 flex flex-col min-h-screen relative">
            <header class="h-16 border-b border-[#2a2f44] bg-[#171b2b] flex items-center justify-between px-6 shadow-lg shrink-0">
                <div>
                    <div><span class="text-[#8b92b6] text-xs">Hoş geldin,</span><span id="userNameDisplay" class="text-sm font-semibold text-white ml-1">Admin</span></div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="statusBadge" class="px-3 py-1 rounded-full text-xs font-semibold bg-green-500/20 text-green-400 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> CANLI SİSTEM</div>
                </div>
            </header>

            <main class="flex-1 p-6 space-y-6 overflow-y-auto bg-[#0f111a]">
                <div id="main-content"></div>
            </main>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/';

        async function fetchWithAuth(url, options = {}) {
            options.headers = { ...options.headers, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
            return fetch(url, options);
        }

        function performLogout() { localStorage.removeItem('token'); window.location.href = '/'; }

        function showToast(msg, type='success') {
            const el = document.getElementById('toastMsg');
            if (!el) return;
            el.classList.remove('hidden');
            el.innerText = msg;
            if(type === 'error') { el.className = 'text-center p-4 mx-6 mb-6 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30'; }
            else if(type === 'info') { el.className = 'text-center p-4 mx-6 mb-6 rounded-lg bg-blue-500/20 text-blue-400 border border-blue-500/30'; }
            else { el.className = 'text-center p-4 mx-6 mb-6 rounded-lg bg-green-500/20 text-green-400 border border-green-500/30'; }
            setTimeout(() => { el.classList.add('hidden'); }, 10000);
        }

        // Sayfa yüklendiğinde aktif menü linkini işaretle
        document.addEventListener('DOMContentLoaded', function() {
            const path = window.location.pathname;
            document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
            const currentLink = document.querySelector(`.menu-link[href="${path}"]`);
            if (currentLink) currentLink.classList.add('active');
        });
    </script>
</body>
</html>
